# DotNetLiguria login theme.
#
# Built on keycloak.v2 (the PatternFly 5 login theme, the default login theme of Keycloak 26.x).
# The classic "keycloak" theme currently selected on the production realm is no longer the
# default and sits behind the LOGIN_V1 feature (disabled by default), so it is not used as a base.
#
# The overridden templates are copies of the 26.6.3 ones: this theme needs Keycloak 26.6 or newer
# (on 26.3 the login page fails: see docs/keycloak-theme.md, "Aggiornare Keycloak").
parent=keycloak.v2
import=common/keycloak

# keycloak.v2/css/styles.css first (layout of the parent), then the DotNetLiguria skin.
styles=css/styles.css css/dotnetliguria.css

# The brand is a navy page with a white card: it is always light. PatternFly dark mode
# would recolour the form controls under the card, so it is switched off for this theme.
darkMode=false

# The theme only changes the way pages look and a few strings (messages/). The language
# of the pages is decided by the realm (Realm settings > Localization): see docs/keycloak-theme.md.
