# DotNetLiguria login theme, English.
# Only the strings that differ from the Keycloak ones (base theme messages_en) are listed here.
# MessageFormat: a single quote is written twice ('').

# Brand, frame and feedback (used by template.ftl)
dnlLogoAlt=DotNetLiguria
dnlFeedback-error=Error
dnlFeedback-warning=Warning
dnlFeedback-success=Success
dnlFeedback-info=Information

# Navigation without the decorative « of the Keycloak text
backToLogin=Back to sign in
