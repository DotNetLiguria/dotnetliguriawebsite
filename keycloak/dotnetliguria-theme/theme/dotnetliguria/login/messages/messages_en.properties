# Page expired (login-page-expired.ftl)
dnlPageExpiredIntro=The time available to complete this step has run out. You can restart the sign-in or try to continue from where you were.
dnlPageExpiredRestart=Restart sign-in
dnlPageExpiredContinue=Continue

# Authenticator setup (login-config-totp.ftl)
dnlTotpQrAlt=QR code to scan with the authenticator app
