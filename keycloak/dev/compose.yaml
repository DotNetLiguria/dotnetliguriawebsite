# Local Keycloak to try the DotNetLiguria login theme. Nothing here touches the production realm.
#
#   export KC_ADMIN_PASSWORD="$(openssl rand -hex 12)"      # throwaway, local only, never committed
#   docker compose -f keycloak/dev/compose.yaml up -d
#   open "http://localhost:18080/realms/DotNetLiguria/protocol/openid-connect/auth?client_id=DotNetLiguriaSpa&response_type=code&scope=openid&redirect_uri=https%3A%2F%2Flocalhost%3A5443%2Fauthentication%2Fcallback"
#   docker compose -f keycloak/dev/compose.yaml down
#
# The theme folder is mounted as it is (no JAR needed) and caching is off: edit a file, reload
# the page. To try the real JAR instead, run keycloak/build-theme.sh and use the commented
# volume below in place of the mounted folder. See docs/keycloak-theme.md.
name: dotnetliguria-keycloak-theme

services:
  keycloak:
    # Same major.minor as production (26.6.x). Override with KEYCLOAK_IMAGE to try another version.
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.3}
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set a throwaway local admin password, see the header of this file}
    ports:
      - "127.0.0.1:${KC_PORT:-18080}:8080"
    volumes:
      - ./realm-dotnetliguria.json:/opt/keycloak/data/import/realm-dotnetliguria.json:ro
      - ../dotnetliguria-theme/theme/dotnetliguria:/opt/keycloak/themes/dotnetliguria:ro
      # Real JAR instead of the folder above (run keycloak/build-theme.sh first):
      # - ../dist/dotnetliguria-login-theme.jar:/opt/keycloak/providers/dotnetliguria-login-theme.jar:ro
