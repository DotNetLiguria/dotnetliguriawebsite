name: dotnetliguria

services:
  prepare-storage:
    image: busybox:1.37.0
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /containers/mongodb \
          /containers/mongodb/db \
          /containers/mongodb/configdb \
          /containers/dotnetliguria/contents \
          /containers/dotnetliguria/data \
          /containers/dotnetliguria/backups \
          /containers/dotnetliguria/not-in-snapshot
        chown -R 10000:10000 /containers/mongodb /containers/dotnetliguria
        chmod 700 /containers/mongodb /containers/dotnetliguria \
          /containers/mongodb/db /containers/mongodb/configdb \
          /containers/dotnetliguria/contents /containers/dotnetliguria/data \
          /containers/dotnetliguria/backups /containers/dotnetliguria/not-in-snapshot
    volumes:
      - type: bind
        source: /docker_data/containers_data
        target: /containers
        bind: {create_host_path: true}

  mongodb:
    image: mongo:9.0.4
    container_name: mongodb
    user: "10000:10000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    command: ["--auth"]
    depends_on:
      prepare-storage:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongodb_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
    volumes:
      - type: bind
        source: /docker_data/containers_data/mongodb/db
        target: /data/db
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/containers_data/mongodb/configdb
        target: /data/configdb
        bind: {create_host_path: true}
    secrets: [mongodb_root_username, mongodb_root_password]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$(cat /run/secrets/mongodb_root_username)" --password "$$(cat /run/secrets/mongodb_root_password)" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  mongodb-init:
    image: mongo:9.0.4
    container_name: mongodb-init
    user: "10000:10000"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      HOME: /tmp
    command:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/provision-application-user.js <<'EOF'
        const fs = require("fs");
        const readSecret = path => fs.readFileSync(path, "utf8").replace(/[\r\n]+$$/, "");
        const rootUsername = readSecret("/run/secrets/mongodb_root_username");
        const rootPassword = readSecret("/run/secrets/mongodb_root_password");
        const appUsername = readSecret("/run/secrets/mongo_app_username");
        const appPassword = readSecret("/run/secrets/mongo_app_password");
        const databaseName = "DotNetLiguria";
        const admin = connect(
          `mongodb://$${encodeURIComponent(rootUsername)}:$${encodeURIComponent(rootPassword)}@mongodb:27017/admin?authSource=admin`
        );
        const applicationDatabase = admin.getSiblingDB(databaseName);
        const roles = [
          { role: "readWrite", db: databaseName },
          { role: "dbAdmin", db: databaseName }
        ];
        if (applicationDatabase.getUser(appUsername) === null) {
          applicationDatabase.createUser({ user: appUsername, pwd: appPassword, roles });
        } else {
          applicationDatabase.updateUser(appUsername, { pwd: appPassword, roles });
        }
        EOF
        mongosh --nodb --quiet --file /tmp/provision-application-user.js
    secrets:
      - mongodb_root_username
      - mongodb_root_password
      - mongo_app_username
      - mongo_app_password
    networks:
      - internal

  website:
    image: dockerhub.ge.vevy.com/dotnetliguria:1.0.9
    container_name: dotnetliguria
    user: "10000:10000"
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      prepare-storage:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
        restart: true
      mongodb-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      ASPNETCORE_ENVIRONMENT: Production
      DOTNETLIGURIA_CONFIG_DIRECTORY: /run/dotnetliguria-config
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/tls/site-cert.pem
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/tls/site-key.pem
      MONGO_APP_USERNAME_FILE: /run/secrets/mongo_app_username
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
      Storage__ContentsRoot: /app/Contents
      Storage__DataRoot: /data
      Storage__BackupsRoot: /backups
      Storage__NotInSnapshotRoot: /not-in-snapshot
      ProfilePhotos__Enabled: "true"
    ports:
      - "443:8443"
    volumes:
      - type: bind
        source: /docker_data/containers_data/dotnetliguria/contents
        target: /app/Contents
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/containers_data/dotnetliguria/data
        target: /data
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/containers_data/dotnetliguria/backups
        target: /backups
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/containers_data/dotnetliguria/not-in-snapshot
        target: /not-in-snapshot
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/global_certs/dotnetliguria
        target: /run/tls
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: /docker_data/global_secrets/dotnetliguria
        target: /run/dotnetliguria-config
        read_only: true
        bind: {create_host_path: false}
    secrets: [mongo_app_username, mongo_app_password]
    networks:
      - frontend
      - internal

secrets:
  mongodb_root_username:
    file: /docker_data/global_secrets/MONGO_INITDB_ROOT_USERNAME_FILE.txt
  mongodb_root_password:
    file: /docker_data/global_secrets/MONGO_INITDB_ROOT_PASSWORD_FILE.txt
  mongo_app_username:
    file: /docker_data/global_secrets/MONGO_APP_USERNAME_FILE.txt
  mongo_app_password:
    file: /docker_data/global_secrets/MONGO_APP_PASSWORD_FILE.txt

networks:
  internal:
    internal: true
  frontend:
    internal: false
